name: Build A21s Android 17 eBPF Kernel

on:
  workflow_dispatch:
    inputs:
      kernelsu_ref:
        description: KernelSU tag or commit
        required: true
        default: v3.3.0
        type: string
      spoof_5_15_release:
        description: Report 5.15.136 to userspace (experimental)
        required: true
        default: true
        type: boolean
  push:
    branches:
      - lineage-24.0
    paths:
      - .github/workflows/build-a21s-android17-kernel.yml
      - ci/**

permissions:
  contents: read

concurrency:
  group: a21s-a17-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: exynos850-a21snsxx_defconfig
      KSU_REF: ${{ inputs.kernelsu_ref || 'v3.3.0' }}
      SPOOF_5_15: ${{ inputs.spoof_5_15_release || 'true' }}

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential clang flex git lld llvm \
            jq libelf-dev libssl-dev pahole python3 rsync zip

      - name: Integrate KernelSU
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh \
            --output /tmp/kernelsu-setup.sh
          bash /tmp/kernelsu-setup.sh "$KSU_REF"
          if ! grep -q 'define MODULE_IMPORT_NS' include/linux/module.h; then
            sed -i \
              '/^MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);$/d' \
              KernelSU/kernel/core/init.c
            echo 'Applied KernelSU MODULE_IMPORT_NS compatibility for Linux 4.19'
          fi
          git -C KernelSU apply \
            "$GITHUB_WORKSPACE/ci/kernelsu-file-ops-linux-4.19.patch"

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 "$DEFCONFIG"
          scripts/kconfig/merge_config.sh -m -O out \
            out/.config ci/android17-bpf.config
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          bash ci/verify-config.sh out/.config
      - name: KernelSU compatibility preflight
        run: |
          set -o pipefail
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            KCFLAGS=-Wno-error drivers/kernelsu/ \
            2>&1 | tee kernelsu-preflight.log



      - name: Build Image and device trees
        run: |
          set -o pipefail
          release_args=()
          if [[ "$SPOOF_5_15" == "true" ]]; then
            release_args+=(KERNELRELEASE=5.15.136-a21s-a17-ebpf-ksu)
          fi
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            KCFLAGS=-Wno-error "${release_args[@]}" Image modules dtbs \
            2>&1 | tee build.log

      - name: Build boot.img and dtbo.img
        run: |
          set -euo pipefail
          mkdir -p dist
          test -s out/arch/arm64/boot/dts/exynos/exynos3830.dtb
          git clone --depth 1 \
            https://android.googlesource.com/platform/system/tools/mkbootimg \
            /tmp/mkbootimg
          base_boot_url="$(curl --fail --location --silent --show-error \
            https://download.lineageos.org/api/v2/devices/a21s/builds \
            | jq -r '.[0].files[] | select(.filename == "boot.img") | .url')"
          test -n "$base_boot_url"
          test "$base_boot_url" != null
          curl --fail --location --show-error "$base_boot_url" \
            --output /tmp/a21s-base-boot.img
          mkdir -p /tmp/a21s-base-boot
          python3 /tmp/mkbootimg/unpack_bootimg.py \
            --boot_img /tmp/a21s-base-boot.img \
            --out /tmp/a21s-base-boot --format mkbootimg -0 \
            > /tmp/a21s-mkbootimg-args
          curl --fail --location --silent --show-error \
            'https://android.googlesource.com/platform/system/libufdt/+/refs/heads/main/utils/src/mkdtboimg.py?format=TEXT' \
            | base64 --decode > /tmp/mkdtboimg.py
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/LineageOS/android_device_samsung_a21s-common/lineage-24.0/configs/kernel/a21s.cfg \
            --output /tmp/a21s.cfg
          cp out/arch/arm64/boot/Image /tmp/a21s-base-boot/kernel
          cp out/arch/arm64/boot/dts/exynos/exynos3830.dtb /tmp/a21s-base-boot/dtb
          mkbootimg_args=()
          while IFS= read -r -d '' arg; do mkbootimg_args+=("$arg"); done \
            < /tmp/a21s-mkbootimg-args
          python3 /tmp/mkbootimg/mkbootimg.py \
            "${mkbootimg_args[@]}" --output dist/boot.img
          python3 /tmp/mkdtboimg.py cfg_create dist/dtbo.img \
            /tmp/a21s.cfg \
            --dtb-dir out/arch/arm64/boot/dts/samsung/a21s
          test "$(stat -c %s dist/boot.img)" -le 37748736
          test "$(stat -c %s dist/dtbo.img)" -le 8388608
          tar -C dist -cf dist/boot.img.tar boot.img

      - name: Verify artifacts
        run: |
          test -s out/arch/arm64/boot/Image
          test -s dist/boot.img
          test -s dist/dtbo.img
          file out/arch/arm64/boot/Image
          mkdir -p dist/dtbs
          cp out/arch/arm64/boot/Image dist/Image
          cp out/.config dist/kernel.config
          cp out/System.map dist/System.map
          cp build.log dist/build.log
          find out/arch/arm64/boot/dts -type f -name '*.dtb' \
            -exec cp {} dist/dtbs/ \; 2>/dev/null || true
          printf '%s\n' "$KSU_REF" > dist/KernelSU-version.txt
          if [[ "$SPOOF_5_15" == "true" ]]; then
            printf '%s\n' '5.15.136-a21s-a17-ebpf-ksu (reported)' \
              > dist/reported-kernel-release.txt
          else
            make -s O=out ARCH=arm64 kernelrelease \
              > dist/reported-kernel-release.txt
          fi
          sha256sum dist/Image dist/boot.img dist/dtbo.img > dist/SHA256SUMS

      - name: Upload kernel bring-up artifact
        uses: actions/upload-artifact@v4
        with:
          name: a21s-android17-ebpf-ksu-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

